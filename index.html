<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wedding Invitation - Ali & Fatima</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #0a0a0a;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        /* --- Audio & Video Elements (Hidden) --- */
        #wedding-audio {
            display: none;
        }

        #background-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100vw;
            min-height: 100vh;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: 1;
            opacity: 0; /* Hidden initially */
            transition: opacity 2s ease-in-out;
            pointer-events: none; /* User cannot interact with it */
        }

        /* --- Doors --- */
        .door {
            position: fixed;
            top: 0;
            width: 50vw;
            height: 100vh;
            background: linear-gradient(135deg, #1f1f1f 0%, #000000 100%);
            z-index: 50;
            transition: transform 2.5s cubic-bezier(0.645, 0.045, 0.355, 1);
            display: flex;
            align-items: center;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
        }

        .door::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 100vh;
            background: linear-gradient(to bottom, #a67c2e, #f7d794, #f7d794, #a67c2e);
            box-shadow: 0 0 15px rgba(247, 215, 148, 0.5);
        }

        #door-left {
            left: 0;
            justify-content: flex-end;
        }

        #door-left::after {
            right: 0;
        }

        #door-right {
            right: 0;
            justify-content: flex-start;
        }

        #door-right::after {
            left: 0;
        }

        .open-left {
            transform: translateX(-100%);
        }

        .open-right {
            transform: translateX(100%);
        }

        /* --- Action Button --- */
        #start-btn {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 60;
            background: linear-gradient(135deg, #f7d794, #a67c2e);
            color: #fff;
            border: 2px solid #f7d794;
            padding: 18px 60px;
            font-family: 'Aref Ruqaa', serif;
            font-size: 2.2rem;
            border-radius: 50px;
            box-shadow: 0 0 40px rgba(166, 124, 46, 0.8);
            cursor: pointer;
            transition: all 0.4s ease;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
            outline: none;
        }

        #start-btn:active {
            transform: translate(-50%, -50%) scale(0.95);
        }

        /* --- screens --- */
        .screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            z-index: 10;
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.45); /* Semi-transparent background for text readability over video */
            transition: opacity 1.5s ease-in-out;
            pointer-events: none;
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* --- text animations --- */
        .screen.active > * {
            animation: slideUpFade 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
            transform: translateY(40px);
        }

        .screen.active > *:nth-child(1) { animation-delay: 0.2s; }
        .screen.active > *:nth-child(2) { animation-delay: 0.8s; }
        .screen.active > *:nth-child(3) { animation-delay: 1.4s; }

        @keyframes slideUpFade {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- Specific Text Styling --- */
        .names-title {
            font-family: 'Aref Ruqaa', serif;
            font-size: 5rem;
            color: #f7d794;
            text-shadow: 0 0 25px rgba(166, 124, 46, 1), 0 0 10px rgba(255, 255, 255, 0.3);
            margin-bottom: 25px;
        }

        .heart {
            color: #e74c3c;
            font-size: 3rem;
            animation: pulse 1.5s infinite;
            display: inline-block;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .quote-text {
            font-family: 'Amiri', serif;
            font-size: 3.2rem;
            line-height: 1.4;
            color: #f7d794;
            text-shadow: 0 0 15px rgba(166, 124, 46, 0.8);
            margin-bottom: 25px;
        }

        .sub-text {
            font-family: 'Cairo', sans-serif;
            font-size: 1.5rem;
            line-height: 1.9;
            color: #e0e0e0;
            max-width: 85%;
        }

        .date-box {
            border-top: 1px solid #f7d794;
            border-bottom: 1px solid #f7d794;
            padding: 25px 0;
            margin: 25px 0;
            width: 80%;
        }
        
        .date-text {
            font-family: 'Amiri', serif;
            font-size: 2.8rem;
            color: #f7d794;
        }
    </style>
</head>
<body>

    <!-- Audio and Video Elements -->
    <audio id="wedding-audio" loop preload="auto">
        <source src="audio.mp3" type="audio/mpeg">
    </audio>

    <video id="background-video" muted playsinline loop preload="auto">
        <source src="video.mp4" type="video/mp4">
    </video>

    <!-- Entry Doors -->
    <div id="door-left" class="door"></div>
    <div id="door-right" class="door"></div>
    
    <!-- Action Button -->
    <button id="start-btn">افتح الدعوة</button>

    <!-- screens -->
    <div id="screen-1" class="screen">
        <h1 class="names-title">علي <span class="heart">❤️</span> فاطمة</h1>
        <p class="sub-text">فرحتنا ما تكمل إلا بوجودكم ويانا</p>
    </div>

    <div id="screen-2" class="screen">
        <h2 class="quote-text">أخذتها بـ فخر.. وصارت حلالي</h2>
        <div class="date-box">
            <div class="date-text">23 / 8 / 2026</div>
        </div>
        <p class="sub-text">ننتظركم تشاركونا هاليوم الحلو.. هلا بيكم وبجيتكم اللي تنورنا</p>
    </div>

    <div id="screen-3" class="screen">
        <h2 class="quote-text">المكان والتفاصيل</h2>
        <p class="sub-text" style="font-size: 1.8rem; color:#f7d794; margin-bottom: 15px; font-weight: bold;">قاعات بغداد الملكية - شارع الأميرات</p>
        <p class="sub-text">حضوركم يزيد الفرحة فرحتين<br>بإنتظاركم</p>
    </div>

    <script>
        // DOM Elements
        const startBtn = document.getElementById('start-btn');
        const doorLeft = document.getElementById('door-left');
        const doorRight = document.getElementById('door-right');
        const weddingAudio = document.getElementById('wedding-audio');
        const backgroundVideo = document.getElementById('background-video');
        const screens = [
            document.getElementById('screen-1'),
            document.getElementById('screen-2'),
            document.getElementById('screen-3')
        ];
        
        let currentScreenIndex = 0;
        let screenIntervalId;

        // Start Invitation Action
        startBtn.addEventListener('click', () => {
            // 1. Hide Button immediately
            startBtn.style.opacity = '0';
            startBtn.style.pointerEvents = 'none';

            // 2. Play Audio & Video (Crucial: Play upon user interaction)
            weddingAudio.play().catch(e => console.error("Audio play failed:", e));
            backgroundVideo.play().catch(e => console.error("Video play failed:", e));

            // 3. Make Video Visible and Fade-in
            backgroundVideo.style.opacity = '1';

            // 4. Start Door Animation
            doorLeft.classList.add('open-left');
            doorRight.classList.add('open-right');

            // 5. Start screens Cycle after door delay
            setTimeout(() => {
                showNextScreen();
            }, 1800);
        });

        // screen Cycle Function
        function showNextScreen() {
            // Remove active class from previous screen
            if (currentScreenIndex > 0) {
                screens[currentScreenIndex - 1].classList.remove('active');
            }

            // Check if there are more screens
            if (currentScreenIndex < screens.length) {
                screens[currentScreenIndex].classList.add('active');
                
                // Show next screen after 7 seconds
                setTimeout(() => {
                    currentScreenIndex++;
                    showNextScreen();
                }, 7000); 
            } else {
                // Loop back to the first screen
                currentScreenIndex = 0;
                screens[0].classList.add('active');
                setTimeout(() => {
                    currentScreenIndex++;
                    showNextScreen();
                }, 7000);
            }
        }
    </script>
</body>
</html>
